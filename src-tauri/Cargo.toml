[package]
name = "CharacterSynthesizer"
version = "0.3.6"
description = "Character Synthesizer & LoRA Training Studio Desktop App"
authors = ["Haine"]
edition = "2021"

[lib]
name = "character_synthesizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "CharacterSynthesizer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
base64 = "0.22"
tauri-plugin-window-state = "2.4.1"
